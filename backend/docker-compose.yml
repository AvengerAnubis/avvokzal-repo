version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: avtovokzal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12341234
      POSTGRES_DB: avtovokzal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend приложение
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avtovokzal-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:12341234@postgres:5432/avtovokzal}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: avtovokzal-postgres-data