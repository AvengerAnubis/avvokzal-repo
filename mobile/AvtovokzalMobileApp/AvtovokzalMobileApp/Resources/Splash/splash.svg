<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="456" height="456" fill="#1E293B" />
  
  <!-- Logo "АВ" -->
  <text x="228" y="180" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">АВ</text>
  
  <!-- Gradient bar -->
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0C0085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0092FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="78" y="230" width="300" height="20" rx="10" ry="10" fill="url(#bar)" />
  
  <!-- Logo "ВОКЗАЛ" -->
  <text x="228" y="290" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ВОКЗАЛ</text>
  
  <!-- Tagline -->
  <text x="228" y="360" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">Поиск и бронирование билетов</text>
</svg>
