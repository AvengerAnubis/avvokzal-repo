# =============================================================================
# Docker Compose — Production (для бэкенда)
# Фронтенд (Next.js) деплоится на Vercel отдельно (через git-интеграцию).
# Этот файл поднимает только: PostgreSQL + Backend (NestJS).
#
# Использование:
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ========== PostgreSQL ==========
  postgres:
    image: postgres:16-alpine
    container_name: avtovokzal-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: avtovokzal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avtovokzal-network

  # ========== Backend (NestJS + Prisma) ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avtovokzal-backend
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/avtovokzal?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - avtovokzal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: avtovokzal-postgres-data-prod

networks:
  avtovokzal-network:
    name: avtovokzal-network
    driver: bridge
